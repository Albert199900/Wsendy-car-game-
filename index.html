<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>WSENDY ULTRA 4D - TOUCH EDITION</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body { background: #000; height: 100vh; display: flex; justify-content: center; align-items: center; font-family: 'Arial Black', sans-serif; overflow: hidden; }
        
        .game-world { 
            position: relative; width: 100%; max-width: 480px; height: 100vh; 
            background: linear-gradient(#004466, #1e90ff); 
            border: 4px solid #00ffff; overflow: hidden; 
        }
        
        canvas { position: relative; z-index: 10; width: 100%; height: 100%; }

        /* HUD */
        .hud { position: absolute; top: 20px; width: 100%; display: flex; justify-content: space-around; z-index: 50; pointer-events: none; }
        .hud-card { 
            background: rgba(0, 0, 0, 0.7); color: #00ffff; padding: 10px; 
            border-radius: 5px; border-bottom: 3px solid #00ffff; font-size: 14px; 
        }

        /* Vitufe maalum juu ya kioo */
        .touch-zones { position: absolute; inset: 0; z-index: 20; display: flex; }
        .zone { flex: 1; height: 100%; } /* Kushoto na Kulia zones */

        .center-controls {
            position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%);
            display: flex; flex-direction: column; gap: 15px; z-index: 100;
        }

        .btn-action {
            width: 100px; padding: 15px; border-radius: 10px; border: none;
            font-weight: bold; color: white; font-size: 16px; box-shadow: 0 4px 0 #000;
        }
        .btn-brake { background: #ff0000; }
        .btn-nitro { background: linear-gradient(to right, #ff8800, #ff0000); animation: pulse 0.5s infinite alternate; }

        @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.1); } }
        
        .overlay { position: absolute; inset: 0; background: #000; z-index: 200; display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; text-align: center; }
        .btn-play { background: #00ffff; color: black; padding: 20px 60px; border-radius: 10px; font-weight: 900; font-size: 25px; border: none; cursor: pointer; }
        
        /* Mtetemeko wa 4D */
        .shake { animation: shake 0.1s infinite; }
        @keyframes shake {
            0% { transform: translate(2px, 2px); }
            50% { transform: translate(-2px, -1px); }
            100% { transform: translate(1px, 2px); }
        }
    </style>
</head>
<body>

<div class="game-world" id="world">
    <canvas id="gameCanvas"></canvas>

    <div class="touch-zones">
        <div class="zone" id="touchLeft"></div>
        <div class="zone" id="touchRight"></div>
    </div>

    <div class="center-controls">
        <button class="btn-action btn-nitro" id="btnNitro">4D NITRO</button>
        <button class="btn-action btn-brake" id="btnBrake">BRAKE 🛑</button>
    </div>

    <div class="hud">
        <div class="hud-card">SPEED: <span id="spd">0</span></div>
        <div class="hud-card">LIFE: <span id="hp">3</span></div>
    </div>

    <div id="startMenu" class="overlay">
        <h1 style="letter-spacing: 5px; color: #00ffff;">WSENDY 4D</h1>
        <p style="margin-bottom: 20px;">Tumia vidole: Kushoto/Kulia kuelekea<br>Katikati kufunga breki</p>
        <button class="btn-play" onclick="startGame()">ANZA KAZI 🏁</button>
    </div>
</div>

<audio id="carSound" loop><source src="https://u.pcloud.link/publink/show?code=XZMOuE5ZfaCbDhEhx9uXY5xBJoVCihqetC87" type="audio/mpeg"></audio>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const world = document.getElementById('world');
    const carSound = document.getElementById('carSound');

    canvas.width = 400; canvas.height = 750;

    let active = false, px = 200, speed = 0, nitro = 100, hp = 3, frame = 0;
    let entities = [];
    let inputs = { left: false, right: false, brake: false, nitro: false };

    function startGame() {
        document.getElementById('startMenu').style.display = 'none';
        active = true; carSound.play(); loop();
    }

    // New Touch Controls Logic
    const lZone = document.getElementById('touchLeft');
    const rZone = document.getElementById('touchRight');
    const nBtn = document.getElementById('btnNitro');
    const bBtn = document.getElementById('btnBrake');

    lZone.ontouchstart = () => inputs.left = true;
    lZone.ontouchend = () => inputs.left = false;
    rZone.ontouchstart = () => inputs.right = true;
    rZone.ontouchend = () => inputs.right = false;
    
    nBtn.ontouchstart = () => inputs.nitro = true;
    nBtn.ontouchend = () => inputs.nitro = false;
    bBtn.ontouchstart = () => inputs.brake = true;
    bBtn.ontouchend = () => inputs.brake = false;

    function loop() {
        if(!active) return;
        ctx.clearRect(0, 0, 400, 750);

        // Movement Physics
        if(inputs.left) px -= 8;
        if(inputs.right) px += 8;
        
        if(inputs.nitro && nitro > 0) {
            speed = 28; nitro -= 0.7;
            world.classList.add('shake');
        } else if(inputs.brake) {
            speed = Math.max(speed - 1, 0);
            world.classList.remove('shake');
        } else {
            speed = 12; // Auto-gas
            world.classList.remove('shake');
        }

        // Draw River & 4D Effects
        ctx.fillStyle = "#1e90ff";
        ctx.fillRect(0, 300, 400, 450);
        
        // 4D Water Flow
        ctx.strokeStyle = "rgba(255,255,255,0.3)";
        ctx.setLineDash([20, 50]);
        ctx.lineDashOffset = -frame * speed;
        ctx.beginPath();
        for(let x=0; x<=400; x+=100) { ctx.moveTo(x, 300); ctx.lineTo(x, 750); }
        ctx.stroke();

        // Entity Spawning (Vikwazo)
        if(frame % 35 === 0) {
            entities.push({ x: Math.random()*300+50, y: 300, z: 0.1, type: Math.random()>0.5?"🪵":"🚙" });
        }

        entities.forEach((e, i) => {
            e.z += speed / 150;
            let scale = e.z * e.z * 8;
            let sx = (e.x - 200) * scale + 200;
            let sy = 300 + scale * 40;

            ctx.font = (20 + scale * 6) + "px Arial";
            ctx.fillText(e.type, sx, sy);

            if(scale > 14 && Math.abs(sx - px) < 50) {
                hp--; entities.splice(i, 1);
                if(hp <= 0) location.reload();
            }
            if(sy > 800) entities.splice(i,1);
        });

        // Player SUV
        ctx.font = "85px Arial";
        ctx.shadowBlur = 15; ctx.shadowColor = inputs.nitro ? "orange" : "transparent";
        ctx.fillText("🚘", px - 42, 680);
        ctx.shadowBlur = 0;

        // Splash 4D Effect
        if(speed > 10) {
            ctx.font = "40px Arial";
            ctx.fillText("💧", px - 80 + (frame%10), 690);
            ctx.fillText("💧", px + 40 - (frame%10), 690);
        }

        // Update UI
        document.getElementById('spd').innerText = Math.floor(speed * 10);
        document.getElementById('hp').innerText = "❤️".repeat(hp);
        carSound.playbackRate = 0.6 + (speed / 20);

        px = Math.max(40, Math.min(360, px));
        frame++;
        requestAnimationFrame(loop);
    }
</script>
</body>
</html>
