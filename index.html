<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<title>GTA STYLE FULL GAME - 3D UPGRADE</title>

<style>
body { margin:0; overflow:hidden; font-family:Arial; }

#ui{
    position:absolute;
    top:10px; left:10px;
    background:rgba(0,0,0,0.6);
    color:white;
    padding:10px;
    border-radius:8px;
}

button{
    margin:4px;
    padding:6px;
    cursor: pointer;
}
</style>
</head>

<body>

<div id="ui">
    <p id="score">Score: 0</p>
    <p id="mission">Mission: Collect Coins</p>

    <button onclick="share()">📲 Share</button>
    <button onclick="saveGame()">💾 Save</button>
    <button onclick="loadGame()">📂 Load</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

let scene, camera, renderer;
let player;

let speed = 0;
let score = 0;
let coinsCollected = 0;

let police = [];
let coins = [];
let ads = [];
let trees = [];

let missions = [
    {target:10, reward:100}
];

let currentMission = 0;

/* ================= INIT ================= */
init();
animate();

function init(){

    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb); // Anga la bluu

    camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 1000);

    renderer = new THREE.WebGLRenderer({antialias:true});
    renderer.setSize(innerWidth, innerHeight);
    document.body.appendChild(renderer.domElement);

    /* MWANGA (LIGHTING - Muhimu kwa 3D halisi) */
    scene.add(new THREE.AmbientLight(0xffffff, 0.6));
    let dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(50, 100, 50);
    scene.add(dirLight);

    /* ARDHI YENYE NYASI (GRASS GROUND) */
    let ground = new THREE.Mesh(
        new THREE.PlaneGeometry(500, 2000),
        new THREE.MeshLambertMaterial({color: 0x2d8a2d}) // Kijani
    );
    ground.rotation.x = -Math.PI/2;
    ground.position.z = -500;
    scene.add(ground);

    /* BARABARA (ROAD) */
    let road = new THREE.Mesh(
        new THREE.PlaneGeometry(12, 2000),
        new THREE.MeshLambertMaterial({color: 0x333333}) // Kijivu cheusi
    );
    road.rotation.x = -Math.PI/2;
    road.position.y = 0.05; // Juu kidogo ya nyasi
    road.position.z = -500;
    scene.add(road);

    /* GARI LA MCHEZAJI (3D PLAYER CAR) */
    player = new THREE.Group();

    // Bodi ya gari (Chassis)
    let chassis = new THREE.Mesh(
        new THREE.BoxGeometry(2, 0.5, 4),
        new THREE.MeshLambertMaterial({color: 0xcc0000}) // Nyekundu
    );
    chassis.position.y = 0.5;
    player.add(chassis);

    // Kichwa/Kioo (Cabin)
    let cabin = new THREE.Mesh(
        new THREE.BoxGeometry(1.5, 0.6, 2),
        new THREE.MeshLambertMaterial({color: 0x880000})
    );
    cabin.position.set(0, 1.05, -0.2);
    player.add(cabin);

    // Matairi (Wheels)
    let wheelGeo = new THREE.CylinderGeometry(0.4, 0.4, 0.3, 16);
    let wheelMat = new THREE.MeshLambertMaterial({color: 0x111111});
    
    let positions = [
        [1.1, 0.4, 1.2], [-1.1, 0.4, 1.2], // Matairi ya mbele
        [1.1, 0.4, -1.2], [-1.1, 0.4, -1.2] // Matairi ya nyuma
    ];

    positions.forEach(pos => {
        let wheel = new THREE.Mesh(wheelGeo, wheelMat);
        wheel.rotation.z = Math.PI / 2;
        wheel.position.set(pos[0], pos[1], pos[2]);
        player.add(wheel);
    });

    scene.add(player);

    /* WEKA MITI PEMBENI MWA BARABARA */
    function createTree(x, z) {
        let tree = new THREE.Group();
        
        // Shina (Trunk)
        let trunk = new THREE.Mesh(
            new THREE.CylinderGeometry(0.3, 0.4, 2),
            new THREE.MeshLambertMaterial({color: 0x5c4033})
        );
        trunk.position.y = 1;
        tree.add(trunk);

        // Majani (Leaves)
        let leaves = new THREE.Mesh(
            new THREE.ConeGeometry(1.5, 3, 8),
            new THREE.MeshLambertMaterial({color: 0x228b22})
        );
        leaves.position.y = 3;
        tree.add(leaves);

        tree.position.set(x, 0, z);
        scene.add(tree);
    }

    for(let i=0; i<100; i++){
        let zPos = Math.random() * -1000;
        // Weka upande wa kushoto au kulia nje ya barabara
        let xPos = Math.random() > 0.5 ? (Math.random() * 20 + 8) : (Math.random() * -20 - 8);
        createTree(xPos, zPos);
    }

    /* POLISI (POLICE CARS) */
    for(let i=0; i<5; i++){
        let p = new THREE.Mesh(
            new THREE.BoxGeometry(2, 1, 4),
            new THREE.MeshLambertMaterial({color: 0x0000ff}) // Bluu
        );
        p.position.set(Math.random()*10-5, 0.5, Math.random()* -200 - 20);
        scene.add(p);
        police.push(p);
    }

    /* COINS (SARAFI) */
    for(let i=0; i<30; i++){
        let c = new THREE.Mesh(
            new THREE.CylinderGeometry(0.4, 0.4, 0.1, 16),
            new THREE.MeshLambertMaterial({color: 0xffd700}) // Dhahabu
        );
        c.rotation.x = Math.PI/2; // Zisimame
        c.position.set(Math.random()*10-5, 0.5, Math.random()* -300 - 10);
        scene.add(c);
        coins.push(c);
    }

    /* ADS */
    ads = [
        {id:"29084400", link:"https://oddlystudent.com/tu1ixct1?key=bf9ebe5967e8fa09c93394892db398f0"},
        {id:"20280116", link:"https://oddlystudent.com/xtf00r92?key=d436ce47c2f2dbf92b6ed9434d9bf01e"}
    ];

    /* KEY CONTROL */
    window.addEventListener("keydown", control);
}

/* ================= CONTROLS ================= */
function control(e){
    if(e.key==="ArrowUp") speed += 0.05; // Imeongezwa spidi kidogo
    if(e.key==="ArrowDown") speed -= 0.05;

    // Kuzuia gari kwenda nyuma kupitiliza
    if(speed < 0) speed = 0; 

    if(e.key==="ArrowLeft") player.position.x -= 0.8;
    if(e.key==="ArrowRight") player.position.x += 0.8;
}

/* ================= SHARE ================= */
function share(){
    window.open("https://wa.me/?text="+encodeURIComponent("Nimecheza GTA Game Score: "+score));
}

/* ================= SAVE ================= */
function saveGame(){
    localStorage.setItem("score", score);
    alert("Game Imesaviwa! Score: " + score);
}

function loadGame(){
    score = Number(localStorage.getItem("score")) || 0;
    document.getElementById("score").innerText = "Score: "+score;
    alert("Game Imepakiwa (Loaded)!");
}

/* ================= GAME LOOP ================= */
function animate(){
    requestAnimationFrame(animate);

    /* MOVE PLAYER */
    player.position.z -= speed;

    /* CAMERA FOLLOW */
    // Kamera inakaa nyuma na juu ya gari
    camera.position.set(player.position.x, 6, player.position.z + 12);
    camera.lookAt(player.position.x, player.position.y, player.position.z - 5);

    /* POLICE AI */
    police.forEach(p=>{
        p.position.x += (player.position.x - p.position.x)*0.02;
        p.position.z += (player.position.z - p.position.z)*0.04;

        if(p.position.distanceTo(player.position) < 2.5){
            alert("🚓 UMEKAMATWA NA POLISI! GAME OVER!");
            location.reload();
        }
    });

    /* COINS ZINAZUNGUKA NA KUKUSANYWA */
    coins.forEach(c=>{
        c.rotation.z += 0.05; // Coin inajizungusha
        if(c.position.y > 0 && c.position.distanceTo(player.position) < 2){
            coinsCollected++;
            score += 10;
            document.getElementById("score").innerText = "Score: "+score;
            c.position.y = -100; // Ficha coin ikikusanywa
        }
    });

    /* SIMPLE AD TRIGGER (distance based) */
    ads.forEach(a=>{
        let fake = new THREE.Vector3(Math.random()*50-25, 0, Math.random()* -500);
        if(player.position.distanceTo(fake) < 1.5){
            window.open(a.link, "_blank");
            console.log("AD OPENED:", a.id);
        }
    });

    /* RENDER */
    renderer.render(scene, camera);
}

// Rekebisha ukubwa wa screen browser ikibadilishwa
window.addEventListener('resize', () => {
    renderer.setSize(window.innerWidth, window.innerHeight);
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
});

</script>

</body>
</html>
