<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<title>GTA STYLE FULL GAME</title>

<style>
body { margin:0; overflow:hidden; font-family:Arial; }

#ui{
position:absolute;
top:10px; left:10px;
background:rgba(0,0,0,0.6);
color:white;
padding:10px;
border-radius:8px;
}

button{
margin:4px;
padding:6px;
}
</style>
</head>

<body>

<div id="ui">
<p id="score">Score: 0</p>
<p id="mission">Mission: Collect Coins</p>

<button onclick="share()">📲 Share</button>
<button onclick="saveGame()">💾 Save</button>
<button onclick="loadGame()">📂 Load</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

let scene, camera, renderer;
let player;

let speed = 0;
let score = 0;
let coinsCollected = 0;

let police = [];
let coins = [];
let ads = [];

let missions = [
{target:10,reward:100}
];

let currentMission = 0;

/* ================= INIT ================= */
init();
animate();

function init(){

scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);

camera = new THREE.PerspectiveCamera(75,innerWidth/innerHeight,0.1,1000);

renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
document.body.appendChild(renderer.domElement);

/* LIGHT */
scene.add(new THREE.AmbientLight(0xffffff));

/* GROUND */
let ground = new THREE.Mesh(
new THREE.PlaneGeometry(200,200),
new THREE.MeshBasicMaterial({color:0x228B22})
);
ground.rotation.x = -Math.PI/2;
scene.add(ground);

/* PLAYER */
player = new THREE.Mesh(
new THREE.BoxGeometry(1,1,2),
new THREE.MeshBasicMaterial({color:0xff0000})
);
player.position.y = 0.5;
scene.add(player);

/* POLICE */
for(let i=0;i<3;i++){
let p = new THREE.Mesh(
new THREE.BoxGeometry(1,1,2),
new THREE.MeshBasicMaterial({color:0x0000ff})
);
p.position.set(Math.random()*20-10,0.5,-20);
scene.add(p);
police.push(p);
}

/* COINS */
for(let i=0;i<20;i++){
let c = new THREE.Mesh(
new THREE.SphereGeometry(0.4),
new THREE.MeshBasicMaterial({color:0xffff00})
);
c.position.set(Math.random()*50-25,0.5,Math.random()*50-25);
scene.add(c);
coins.push(c);
}

/* ADS */
ads = [
{
id:"29084400",
link:"https://oddlystudent.com/tu1ixct1?key=bf9ebe5967e8fa09c93394892db398f0"
},
{
id:"20280116",
link:"https://oddlystudent.com/xtf00r92?key=d436ce47c2f2dbf92b6ed9434d9bf01e"
}
];

/* KEY CONTROL */
window.addEventListener("keydown",control);

}

/* ================= CONTROLS ================= */
function control(e){

if(e.key==="ArrowUp") speed += 0.02;
if(e.key==="ArrowDown") speed -= 0.02;

if(e.key==="ArrowLeft") player.position.x -= 0.5;
if(e.key==="ArrowRight") player.position.x += 0.5;

}

/* ================= SHARE ================= */
function share(){
window.open("https://wa.me/?text="+encodeURIComponent("Nimecheza GTA Game Score: "+score));
}

/* ================= SAVE ================= */
function saveGame(){
localStorage.setItem("score",score);
}

function loadGame(){
score = Number(localStorage.getItem("score")) || 0;
}

/* ================= GAME LOOP ================= */
function animate(){
requestAnimationFrame(animate);

/* MOVE PLAYER */
player.position.z -= speed;

/* CAMERA FOLLOW */
camera.position.set(player.position.x,5,player.position.z+10);
camera.lookAt(player.position);

/* POLICE AI */
police.forEach(p=>{
p.position.x += (player.position.x - p.position.x)*0.03;
p.position.z += (player.position.z - p.position.z)*0.06;

if(p.position.distanceTo(player.position)<2){
alert("🚓 GAME OVER!");
location.reload();
}
});

/* COINS */
coins.forEach(c=>{
if(c.position.distanceTo(player.position)<1){
coinsCollected++;
score += 10;
document.getElementById("score").innerText = "Score: "+score;
c.position.y = -100;
}
});

/* ADS SYSTEM */
ads.forEach(a=>{
if(player.position.distanceTo(new THREE.Vector3(Math.random(),0,Math.random()))<0.1){
// not used trigger style (simple version below)
}
});

/* SIMPLE AD TRIGGER (distance based) */
ads.forEach(a=>{
let fake = new THREE.Vector3(Math.random()*50-25,0,Math.random()*50-25);

if(player.position.distanceTo(fake)<1){
window.open(a.link,"_blank");
console.log("AD OPENED:",a.id);
}
});

/* RENDER */
renderer.render(scene,camera);

}

</script>

</body>
</html>
