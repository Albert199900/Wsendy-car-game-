<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Mchezo wa Gari - 3D na Sauti</title>
<style>
body { margin: 0; overflow: hidden; font-family: 'Segoe UI', Tahoma, sans-serif; touch-action: none; }

#ui {
    position: absolute; top: 10px; left: 10px; background: rgba(0, 0, 0, 0.7);
    color: white; padding: 10px 15px; border-radius: 8px; pointer-events: none; z-index: 10;
}
#score { font-size: 1.2em; margin-bottom: 5px; font-weight: bold; }
#speed { font-size: 1em; color: #00ffcc; margin-bottom: 5px; }
#ad-counter { font-size: 0.9em; color: #ffd700; font-weight: bold; }

/* Kitufe cha Pause */
#pause-btn {
    position: absolute; top: 10px; right: 10px; background: rgba(0, 0, 0, 0.7);
    color: white; padding: 10px 15px; border-radius: 8px; font-weight: bold;
    cursor: pointer; z-index: 10; border: 2px solid white;
}

#touch-controls {
    position: absolute; bottom: 20px; width: 100%; display: none;
    justify-content: space-between; pointer-events: none; z-index: 50;
}
.control-group { display: flex; gap: 15px; padding: 0 20px; pointer-events: auto; }
.touch-btn {
    width: 60px; height: 60px; background: rgba(255, 255, 255, 0.3);
    border: 2px solid white; border-radius: 50%; color: white; font-size: 1.5em;
    font-weight: bold; display: flex; justify-content: center; align-items: center;
    user-select: none; cursor: pointer;
}
.touch-btn:active { background: rgba(255, 255, 255, 0.7); color: black; }

.overlay {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0, 0, 0, 0.85); display: none; flex-direction: column;
    justify-content: center; align-items: center; z-index: 200; backdrop-filter: blur(5px); text-align: center;
}
.overlay h1 { color: white; font-size: 3em; margin-bottom: 20px; text-shadow: 2px 2px 5px rgba(0,0,0,0.8); }
.overlay button {
    margin: 10px; padding: 15px 30px; font-size: 1.2em; font-weight: bold; cursor: pointer;
    border: none; border-radius: 10px;
}
.btn-primary { background: #ff4444; color: white; border: 3px solid #cc0000 !important; }
.btn-success { background: #44ff44; color: black; }
.btn-whatsapp { background: #25D366; color: white; display: flex; align-items: center; gap: 10px; }

</style>
</head>
<body>

<div id="ui">
    <div id="score">Score: 0</div>
    <div id="speed">Speed: 0 km/h</div>
    <div id="ad-counter">Matangazo: 0/5</div>
</div>

<button id="pause-btn" onclick="togglePause()">⏸ Sitisha</button>

<div id="touch-controls">
    <div class="control-group">
        <div class="touch-btn" id="btn-left">◀</div>
        <div class="touch-btn" id="btn-right">▶</div>
    </div>
    <div class="control-group">
        <div class="touch-btn" id="btn-brake" style="background: rgba(255,0,0,0.4);">B</div>
        <div class="touch-btn" id="btn-gas" style="background: rgba(0,255,0,0.4);">G</div>
    </div>
</div>

<div id="start-screen" class="overlay" style="display: flex;">
    <h1>Mbio za Nyikani</h1>
    <p style="color:white; margin-bottom: 20px;">Washa Sauti ya Simu Yako 🔊</p>
    <button class="btn-primary" onclick="startGame()">▶ CHEZA SASA</button>
</div>

<div id="pause-screen" class="overlay">
    <h1>IMESITISHWA</h1>
    <button class="btn-success" onclick="togglePause()">▶ Endelea (Back)</button>
</div>

<div id="game-over-screen" class="overlay">
    <h1 style="color: #ff4444;">UMEKAMATWA!</h1>
    <span style="font-size:1.5em; color:white; margin-bottom:20px;" id="final-score"></span>
    <button class="btn-success" onclick="resetGame()">↻ Cheza Tena</button>
    <button class="btn-whatsapp" onclick="shareScreenshot()">📲 Shiriki Picha WhatsApp</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>
let scene, camera, renderer, player, road;
let gameOver = false, gameStarted = false, isPaused = false;
let obstacles = [], trees = [], mountains = [], adBoxes = [];
let speed = 0, score = 0, adsWatched = 0;
let levelUnlocked = false;

const maxSpeed = 0.6, playerLaneWidth = 4, totalLanes = 3, playerMovementSpeed = 0.15;

const adLinks = [
    {id:"29084400", link:"https://oddlystudent.com/tu1ixct1?key=bf9ebe5967e8fa09c93394892db398f0"},
    {id:"20280116", link:"https://oddlystudent.com/xtf00r92?key=d436ce47c2f2dbf92b6ed9434d9bf01e"}
];

let isPressingGas = false, isPressingBrake = false;
const scoreElement = document.getElementById("score");
const speedElement = document.getElementById("speed");
const adCounterElement = document.getElementById("ad-counter");

/* ===== SAUTI ===== */
let audioCtx, engineOsc, engineGain;

function initAudio() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        engineOsc = audioCtx.createOscillator();
        engineOsc.type = 'sawtooth';
        engineOsc.frequency.value = 50; 
        
        let filter = audioCtx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.value = 300; 
        
        engineGain = audioCtx.createGain();
        engineGain.gain.value = 0.1;
        
        engineOsc.connect(filter); filter.connect(engineGain); engineGain.connect(audioCtx.destination);
        engineOsc.start();
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
}

function playCrashSound() {
    if(!audioCtx) return;
    let osc = audioCtx.createOscillator(); osc.type = 'square';
    osc.frequency.setValueAtTime(150, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(20, audioCtx.currentTime + 0.5);
    let gain = audioCtx.createGain();
    gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + 0.5);
}

/* ===== INIT MAP ===== */
init();
animate();

function init() {
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb);
    scene.fog = new THREE.Fog(0x87ceeb, 50, 150);

    camera = new THREE.PerspectiveCamera(75, innerWidth / innerHeight, 0.1, 1000);
    camera.position.set(0, 5, 10);
    camera.lookAt(0, 0, -5);

    // Muhimu: preserveDrawingBuffer inaruhusu kupiga picha kioo (Screenshot)
    renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
    renderer.setSize(innerWidth, innerHeight);
    document.body.appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0xffffff, 0.6));
    let sunLight = new THREE.DirectionalLight(0xffffff, 0.8);
    sunLight.position.set(10, 20, 15);
    scene.add(sunLight);

    road = new THREE.Mesh(new THREE.PlaneGeometry(12, 1000), new THREE.MeshStandardMaterial({ color: 0x333333 }));
    road.rotation.x = -Math.PI / 2;
    scene.add(road);

    player = new THREE.Group();
    const body = new THREE.Mesh(new THREE.BoxGeometry(1.8, 1, 4), new THREE.MeshStandardMaterial({ color: 0xff4444 })); // Rangi ya gari
    body.position.y = 0.6; player.add(body);
    const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.7, 2), new THREE.MeshStandardMaterial({ color: 0x111111, transparent: true, opacity: 0.8 }));
    cabin.position.set(0, 1.3, -0.3); player.add(cabin);
    scene.add(player);

    createMountains(); createTrees(); createObstacles(); createAdBoxes();

    window.addEventListener("keydown", handleKeyDown); window.addEventListener("keyup", handleKeyUp);
    setupTouchControls();
}

function setupTouchControls() {
    const btnLeft = document.getElementById("btn-left"), btnRight = document.getElementById("btn-right");
    const btnGas = document.getElementById("btn-gas"), btnBrake = document.getElementById("btn-brake");
    btnLeft.addEventListener("touchstart", (e) => { e.preventDefault(); if(!isPaused) player.userData.movingLeft = true; });
    btnLeft.addEventListener("touchend", (e) => { e.preventDefault(); player.userData.movingLeft = false; });
    btnRight.addEventListener("touchstart", (e) => { e.preventDefault(); if(!isPaused) player.userData.movingRight = true; });
    btnRight.addEventListener("touchend", (e) => { e.preventDefault(); player.userData.movingRight = false; });
    btnGas.addEventListener("touchstart", (e) => { e.preventDefault(); if(!isPaused) isPressingGas = true; });
    btnGas.addEventListener("touchend", (e) => { e.preventDefault(); isPressingGas = false; });
    btnBrake.addEventListener("touchstart", (e) => { e.preventDefault(); if(!isPaused) isPressingBrake = true; });
    btnBrake.addEventListener("touchend", (e) => { e.preventDefault(); isPressingBrake = false; });
}

/* ===== LOGIC MPYA (PAUSE, UNLOCK, SHARE) ===== */
function startGame() {
    initAudio(); 
    document.getElementById("start-screen").style.display = "none";
    document.getElementById("touch-controls").style.display = "flex";
    gameStarted = true; isPaused = false; speed = 0.1;
    if(engineGain) engineGain.gain.value = 0.1;
}

function togglePause() {
    if(!gameStarted || gameOver) return;
    isPaused = !isPaused;
    document.getElementById("pause-screen").style.display = isPaused ? "flex" : "none";
    if (isPaused) {
        if(engineGain) engineGain.gain.value = 0; // Zima sauti
    } else {
        if(engineGain) engineGain.gain.value = 0.1; // Washa sauti
    }
}

function unlockNewTheme() {
    if(levelUnlocked) return;
    levelUnlocked = true;

    // 1. Badilisha Gari liwe Bluu na Weka Spoiler
    player.children[0].material.color.setHex(0x0044ff); 
    let spoiler = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.2, 0.6), new THREE.MeshStandardMaterial({color: 0x111111}));
    spoiler.position.set(0, 1.2, 1.8);
    player.add(spoiler);

    // 2. Badilisha Anga na Ukungu (Jioni/Sunset)
    scene.background.setHex(0xff7e00); 
    scene.fog.color.setHex(0xff7e00);

    // 3. Badilisha Rangi ya Miti
    trees.forEach(t => t.material.color.setHex(0x8b4513)); // Miti ya kahawia

    alert("🎉 HONGERA! Umetazama matangazo 5.\nUmefungua Gari Jipya la Bluu na Mandhari ya Jioni!");
}

async function shareScreenshot() {
    // Chukua picha ya kioo (Screenshot) ya Game
    const dataUrl = renderer.domElement.toDataURL("image/jpeg", 0.9);
    
    try {
        const res = await fetch(dataUrl);
        const blob = await res.blob();
        const file = new File([blob], "score_yangu.jpg", { type: "image/jpeg" });

        const shareText = `Nimepata alama ${Math.floor(score)} kwenye mchezo huu wa gari 3D! Je, unaweza kunishinda?`;

        // Tumia Web Share API kushare picha moja kwa moja WhatsApp
        if (navigator.share && navigator.canShare({ files: [file] })) {
            await navigator.share({
                title: "Mchezo wa Gari 3D",
                text: shareText,
                files: [file]
            });
        } else {
            // Kama browser haikubali, mpe link ya WhatsApp na idownload picha kwanza
            alert("Simu/Browser yako hairuhusu kushare picha moja kwa moja. Picha itapakuliwa (download), kisha WhatsApp itafunguka.");
            
            let a = document.createElement('a');
            a.href = dataUrl;
            a.download = 'Mchezo_Score.jpg';
            a.click();
            
            window.open(`https://wa.me/?text=${encodeURIComponent(shareText)}`, "_blank");
        }
    } catch (error) {
        console.error("Kuna shida kushare:", error);
    }
}

function resetGame() {
    gameOver = false; isPaused = false; gameStarted = true; speed = 0.1; score = 0;
    player.position.set(0, 0, 0);
    obstacles.forEach(o => scene.remove(o)); obstacles = []; createObstacles();
    adBoxes.forEach(a => scene.remove(a.mesh)); adBoxes = []; createAdBoxes();
    document.getElementById("game-over-screen").style.display = "none";
    if(engineGain) engineGain.gain.value = 0.1; 
}

function triggerGameOver() {
    gameOver = true; speed = 0; isPressingGas = false;
    playCrashSound(); 
    if(engineGain) engineGain.gain.value = 0; 
    document.getElementById("final-score").innerText = "Score Yako: " + Math.floor(score);
    document.getElementById("game-over-screen").style.display = "flex";
}

/* ===== KEYBOARD CONTROLS ===== */
function handleKeyDown(e) {
    if (!gameStarted || gameOver || isPaused) return;
    if (e.key === "ArrowUp") isPressingGas = true; if (e.key === "ArrowDown") isPressingBrake = true;
    if (e.key === "ArrowLeft") player.userData.movingLeft = true; if (e.key === "ArrowRight") player.userData.movingRight = true;
    if (e.key === "p" || e.key === "P") togglePause(); // Shortcut ya Pause
}
function handleKeyUp(e) {
    if (e.key === "ArrowUp") isPressingGas = false; if (e.key === "ArrowDown") isPressingBrake = false;
    if (e.key === "ArrowLeft") player.userData.movingLeft = false; if (e.key === "ArrowRight") player.userData.movingRight = false;
}

/* ===== MAP CREATION ===== */
function createMountains() {
    for (let i = 0; i < 15; i++) {
        let mtn = new THREE.Mesh(new THREE.ConeGeometry(15, 30, 8), new THREE.MeshStandardMaterial({ color: 0x888888, flatShading: true }));
        mtn.position.set((Math.random() > 0.5 ? 1 : -1) * 35, 15, -Math.random() * 200); scene.add(mtn); mountains.push(mtn);
    }
}
function createTrees() {
    for (let i = 0; i < 40; i++) {
        let tree = new THREE.Mesh(new THREE.ConeGeometry(2, 6, 8), new THREE.MeshStandardMaterial({ color: 0x228b22, flatShading: true }));
        tree.position.set((Math.random() > 0.5 ? 1 : -1) * (8 + Math.random() * 15), 3, -Math.random() * 180); scene.add(tree); trees.push(tree);
    }
}
function createObstacles() {
    for (let i = 0; i < 6; i++) {
        let obs = new THREE.Mesh(new THREE.BoxGeometry(2.5, 2.5, 2.5), new THREE.MeshStandardMaterial({ color: 0x444444 }));
        resetObj(obs); obs.position.z = -50 - i * 40; scene.add(obs); obstacles.push(obs);
    }
}
function createAdBoxes() {
    for (let i = 0; i < 2; i++) {
        let box = new THREE.Mesh(new THREE.BoxGeometry(1.5, 1.5, 1.5), new THREE.MeshStandardMaterial({ color: 0xffd700, emissive: 0x554400 }));
        resetObj(box); box.position.z = -100 - i * 150; scene.add(box);
        adBoxes.push({ mesh: box, linkData: adLinks[i % adLinks.length] });
    }
}
function resetObj(obj) { obj.position.set((Math.floor(Math.random() * totalLanes) - 1) * playerLaneWidth, 1.25, player.position.z - 200 - Math.random() * 100); }

/* ===== LOOP NA ANIMATION ===== */
function animate() {
    requestAnimationFrame(animate); 
    
    // KAMA IMESITISHWA, usiendelee kuhesabu ila fanya render tu ili picha ibaki
    if (isPaused) {
        renderer.render(scene, camera);
        return; 
    }
    
    renderer.render(scene, camera);
    if (!gameStarted || gameOver) return;

    if (isPressingGas) speed = Math.min(speed + 0.005, maxSpeed);
    else if (isPressingBrake) speed = Math.max(speed - 0.01, 0);
    else speed = Math.max(speed - 0.001, 0.05);

    if(engineOsc) engineOsc.frequency.value = 50 + (speed * 400); 

    if (player.userData.movingLeft && player.position.x > -playerLaneWidth) player.position.x -= playerMovementSpeed;
    if (player.userData.movingRight && player.position.x < playerLaneWidth) player.position.x += playerMovementSpeed;
    
    player.position.z -= speed;
    camera.position.x = player.position.x * 0.2; camera.position.z = player.position.z + 10;
    camera.lookAt(player.position.x, 0, player.position.z - 5);

    if (speed > 0) { 
        score += speed; 
        scoreElement.innerText = `Score: ${Math.floor(score)}`; 
        speedElement.innerText = `Speed: ${Math.floor(speed * 200)} km/h`; 
    }
    road.position.z = player.position.z - (player.position.z % 1000); 

    [trees, mountains].forEach(g => g.forEach(i => { if (i.position.z > camera.position.z + 20) i.position.z -= 200; }));

    obstacles.forEach(obs => {
        if (obs.position.z > player.position.z + 10) resetObj(obs); 
        if (Math.abs(player.position.x - obs.position.x) < 2 && Math.abs(player.position.z - obs.position.z) < 3) triggerGameOver();
    });

    adBoxes.forEach(ad => {
        ad.mesh.rotation.y += 0.05; ad.mesh.rotation.x += 0.02;
        if (ad.mesh.position.z > player.position.z + 10) resetObj(ad.mesh);
        
        // Ukigusa boksi la tangazo
        if (Math.abs(player.position.x - ad.mesh.position.x) < 2 && Math.abs(player.position.z - ad.mesh.position.z) < 3) {
            window.open(ad.linkData.link, "_blank");
            score += 500; 
            resetObj(ad.mesh);
            
            // ONGEZA KAUNTA YA MATANGAZO
            adsWatched++;
            adCounterElement.innerText = `Matangazo: ${adsWatched}/5`;
            
            // UKIFIKISHA 5 BADILISHA GARI NA MANDHARI
            if(adsWatched === 5) {
                unlockNewTheme();
            }
        }
    });
}
</script>
</body>
</html>
